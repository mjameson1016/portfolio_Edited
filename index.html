<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <header class="site-header" id="site-header"></header>

  <!-- Optional hero image — shown only if headerImage is set in config -->
  <div class="site-hero hidden" id="site-hero"></div>

  <main class="site-wrap">

    <!-- All grid-based sections share this container; JS filters by category -->
    <div id="grid-container" class="hidden">
      <div class="project-grid" id="project-grid"></div>
    </div>

    <!-- About -->
    <div data-section="about" id="about-container" class="hidden">
      <div id="about-section"></div>
    </div>

    <!-- Contact -->
    <div data-section="contact" id="contact-container" class="hidden">
      <div id="contact-section"></div>
    </div>

  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="config.js"></script>
  <script src="js/portfolio.js"></script>

<div id="lightbox" class="lightbox hidden">
  <button class="lightbox-prev" aria-label="Previous image">‹</button>

  <img id="lightbox-image" src="" alt="">

  <button class="lightbox-next" aria-label="Next image">›</button>
</div>

</body>
</html>
